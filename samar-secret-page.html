<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پرونده محرمانه</title>
<style>
body{background:linear-gradient(135deg,#19001f,#650044);color:white;font-family:Tahoma,sans-serif;text-align:center;padding:50px 15px}
.box{background:rgba(255,255,255,.12);padding:30px 20px;border-radius:20px;max-width:350px;margin:auto;box-shadow:0 0 25px #ff4da6}
h1{color:#ffacd5}
input,button{padding:13px;border:0;border-radius:10px;margin-top:15px;width:85%;font-size:16px;box-sizing:border-box}
button{background:#ff4da6;color:white;cursor:pointer}
#message{display:none;margin-top:25px;line-height:2;color:#ffd6e9}
</style>
</head>
<body>
<div class="box">
<h1>🔐 پرونده محرمانه ثمر</h1>
<p>برای دیدن پیام، رمز را وارد کن ❤️</p>
<input type="password" id="pass" placeholder="رمز عبور">
<button onclick="checkPassword()">باز کردن پیام</button>
<div id="message">
<h2>ثمر ❤️</h2>
<p>آسوده خاطرم که تو در خاطر منی؛<br>بعضی آدم‌ها فقط یک نفر نیستند،<br>تمام زیبایی یک دنیا هستند.</p>
<p>❤️ همیشه باارزش باشی</p>
</div>
</div>
<script>
function checkPassword(){
 if(document.getElementById('pass').value==='1399'){
  document.getElementById('message').style.display='block';
 }else{alert('رمز اشتباه است!');}
}
</script>
</body>
</html>
